<body class="sheet-page ds-experience ds-workspace-page">
  <a class="skip-link" href="#sheet-app">Skip to degree worksheet</a>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="DegreeSteps home"><span class="ds-wordmark">Degree<span class="ds-wordmark-steps">Steps</span></span></a>
    <nav class="workspace-nav" aria-label="Main navigation"><a href="portal.html">My home</a><a href="plan.html" aria-current="page">My plan</a><a href="community.html?tab=feed">Community</a></nav>
    <a class="header-library" href="library.html">Policy library <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></a>
  </header>
  <main class="sheet-main">
    <div id="sheet-app" tabindex="-1" aria-label="Your degree plan workbook">
      <div id="sheet-status" role="status" aria-live="polite"></div>
      <div id="sheet-loading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11M15 9v11M3 14.5h18"/></svg><p>Opening your degree worksheet…</p></div>
      <div id="sheet-error" role="alert" hidden></div>
      <section id="sheet-workspace" aria-label="Degree plan worksheet" hidden>
        <div id="sheet-titlebar"></div>
        <div class="plan-layout">
          <div class="plan-main">
            <div id="sheet-glance" hidden></div>
            <div id="sheet-controls"></div>
            <div id="sheet-review-note"></div>
            <div id="sheet-toolbar"></div>
            <p id="sheet-scroll-help">Swipe across to edit courses and progress →</p>
            <div id="sheet-grid" tabindex="0" role="region" aria-label="Degree requirement table" aria-describedby="sheet-scroll-help"></div>
            <div id="sheet-footer"></div>
          </div>
          <aside class="plan-side" aria-label="Plan summary">
            <div id="sheet-summary"></div>
            <details class="plan-detail-section"><summary>Cost estimates &amp; savings</summary><div id="sheet-savings" hidden><div id="sheet-planning-range" hidden></div><div id="sheet-savings-tracker"></div></div></details>
            <div id="sheet-next"></div>
            <details id="sheet-task-panel"><summary>All tasks and checklist</summary><div id="sheet-home"></div></details>
            <div id="sheet-course-assessments" hidden></div>
            <div id="sheet-program-requirements" hidden></div>
            <div id="sheet-school-check" hidden></div>
            <div id="sheet-lead-actions" hidden></div>
            <div id="sheet-alerts" hidden></div>
            <div id="sheet-route"></div>
            <div id="sheet-context"></div>
            <div id="sheet-momentum" hidden></div>
          </aside>
        </div>
        <div class="plan-bottom-bar"><button type="button" class="button secondary" data-action="ask-school">Ask the school</button><button type="button" class="button primary" data-action="save-plan">Save my plan</button></div>
      </section>
      <noscript><div class="notice"><strong>Enable JavaScript to open your degree worksheet.</strong><p>You can still <a href="library.html">browse the policy library</a>.</p></div></noscript>
    </div>
  </main>
  <dialog id="sheet-dialog" aria-label="Degree plan details"><button id="close-sheet-dialog" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button><div id="sheet-dialog-savings" hidden></div><div id="sheet-dialog-content"></div></dialog>
