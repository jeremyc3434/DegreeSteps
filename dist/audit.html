<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>Open your degree plan — DegreeSteps</title>
  <link rel="stylesheet" href="portal.css">

<link rel="stylesheet" href="/ds-tokens.css"><link rel="stylesheet" href="/brand.css"><link rel="stylesheet" href="/experience.css"><link rel="stylesheet" href="/ds-components.css"><link rel="stylesheet" href="/workspace-design.css"><link rel="stylesheet" href="/discovery-design.css"><link rel="stylesheet" href="/ds-overlays.css"><script src="/site-header.js" defer></script><script src="/growth-metrics.js" defer></script></head>
<body class="portal-page ds-experience ds-workspace-page ds-discovery-page">
  <header class="portal-header"><a class="brand" href="/" aria-label="DegreeSteps home"><span class="ds-wordmark">Degree<span class="ds-wordmark-steps">Steps</span></span></a></header>
  <main id="legacy-plan-handoff" class="portal-question">
    <h1>Let’s open your plan.</h1>
    <p class="portal-lede">Continue in My plan. Your saved work has not been changed.</p>
    <a class="portal-primary" id="current-plan-link" href="/portal.html">Open my plan</a>
    <noscript><p>You can use the button to continue.</p></noscript>
  </main>
  <script id="legacy-audit-redirect">
  (function () {
    'use strict';
    // Opening this older address must never replace a student's saved records.
    const target = new URL('/portal.html', location.origin), input = new URLSearchParams(location.search);
    if (!['http:','https:'].includes(target.protocol) || target.origin !== location.origin) return;
    const ids = new Set(['program','usePlan','template','shared']);
    const choices = {level:['associate','bachelor','master','doctorate','specialist'],format:['online','campus'],view:['setup','edit','about','preferences','review','school'],share:['1']};
    for (const [name,value] of input) {
      if (target.searchParams.has(name) || /[\u0000-\u001f\u007f]/.test(value)) continue;
      if (name === 'school' && value.trim() && value.length <= 120 || ids.has(name) && /^[A-Za-z0-9][A-Za-z0-9_-]{0,159}$/.test(value) || Object.hasOwn(choices,name) && choices[name].includes(value)) target.searchParams.set(name,value);
    }
    if (/^#[A-Za-z][A-Za-z0-9_-]{0,79}$/.test(location.hash)) target.hash = location.hash;
    const destination = target.pathname + target.search + target.hash;
    document.getElementById('current-plan-link').setAttribute('href',destination);
    location.replace(destination);
  }());
  </script>
</body>
</html>
