name: Course workspace QA
on:
  pull_request:
    paths:
      - 'server/learning*.mjs'
      - 'dist/learn*'
      - 'dist/app-shell.*'
      - 'dist/account-return.js'
      - 'dist/account.js'
      - 'server/auth.mjs'
      - 'worker/**'
      - 'db/postgres/learning.sql'
      - 'db/learning-billing-schema.mjs'
      - 'drizzle/**'
      - 'scripts/build-community.mjs'
      - '*learning*.test.*'
      - 'package*.json'
      - '.github/workflows/learning-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learning-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  course-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # The Core checks workflow builds and tests both Worker boundaries. This
      # job exercises the actual committed UI without rebuilding the catalog.
      - name: Check private storage, source and billing logic
        run: node --test --test-isolation=none server/learning*.test.mjs learning-client.test.cjs
      - name: Install isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/degreesteps-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Check desktop and phone course workflows
        env:
          NODE_PATH: ${{ runner.temp }}/degreesteps-browser/node_modules
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome)"
          test -n "$CHROMIUM_PATH"
          node learning-workspace-browser.test.cjs
      - name: Save course workspace screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: course-workspace-browser
          path: outputs/learning/browser
          if-no-files-found: ignore
          retention-days: 14
