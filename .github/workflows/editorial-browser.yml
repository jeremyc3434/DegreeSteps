name: Editorial browser QA
on:
  pull_request:
    paths:
      - 'content/public-content.json'
      - 'content/issue56-editorial-inventory.json'
      - 'dist/data/credit-sources.json'
      - 'dist/data/course-catalog.json'
      - 'dist/courses.js'
      - 'dist/courses.html'
      - 'dist/courses.css'
      - 'dist/course-library-engine.js'
      - 'dist/sheet-state.js'
      - 'dist/guide-engine.js'
      - 'dist/journey-engine.js'
      - 'dist/portal.js'
      - 'dist/school.js'
      - 'dist/school.html'
      - 'dist/portal.html'
      - 'dist/portal.css'
      - 'dist/student-checklist.js'
      - 'dist/student-checklist-view.js'
      - 'dist/student-checklist.css'
      - 'dist/plan.html'
      - 'dist/sheet.js'
      - 'dist/sheet.css'
      - 'dist/import-courses.js'
      - 'dist/import-courses.html'
      - 'dist/import-courses.css'
      - 'dist/program-catalog.js'
      - 'dist/data/pathways.json'
      - 'dist/data/program-catalog.json'
      - 'dist/data/curriculum-registry.json'
      - 'dist/data/curricula/wgu.json'
      - 'dist/degree-audit.js'
      - 'dist/degree-audit.html'
      - 'dist/degree-audit.css'
      - 'dist/provider-registry.js'
      - 'content/catalog/christian-leaders-course-identities-reviewed-2026-11-27.json'
      - 'scripts/cli-course-catalog.mjs'
      - 'scripts/build-community.mjs'
      - 'scripts/import-course-catalog.py'
      - 'scripts/build-public-site.mjs'
      - 'scripts/provider-research-facts.mjs'
      - 'issue56-public-browser.test.cjs'
      - 'shared-transfer-browser.test.cjs'
      - 'student-scenarios-browser.test.cjs'
      - 'test-support/offline-site.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/editorial-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editorial-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/degreesteps-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Check desktop and phone journeys
        env:
          NODE_PATH: ${{ runner.temp }}/degreesteps-browser/node_modules
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome)"
          test -n "$CHROMIUM_PATH"
          node issue56-public-browser.test.cjs
          node shared-transfer-browser.test.cjs
          node student-scenarios-browser.test.cjs
      - name: Save public screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: editorial-public-browser
          path: |
            outputs/issue56/browser
            outputs/student-scenarios/browser
          if-no-files-found: ignore
          retention-days: 14
