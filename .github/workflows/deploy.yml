name: Deploy

# Staging deploys automatically after every merge to main. Production deploys only when the owner runs this
# workflow by hand, chooses "production" and confirms the data-migration check (the same gate as
# scripts/check-production-config.mjs). Credentials come from repository secrets:
#   CLOUDFLARE_API_TOKEN - Cloudflare API token with Workers Scripts: Edit and D1: Edit on the owner account
#   ANTHROPIC_API_KEY    - optional; when present it is (re)written as the Worker secret on every deploy
#   RESEND_API_KEY       - optional; Resend sending key for email plan alerts, (re)written as a Worker secret the same way.
#   LEADS_HASH_SALT      - optional; salt for the daily per-visitor limit on school contact and Plan review requests,
#   COACH_HASH_SALT        and for the degree coach. Each is (re)written as a Worker secret only when the GitHub secret exists.
# Feature flags and plain settings come from environment variables (Settings > Environments > staging or production >
# Environment variables): SCHOOL_INQUIRIES_ENABLED, PLAN_REVIEW_ENABLED and EMAIL_ALERTS_ENABLED (each off unless 1),
# and EMAIL_POSTAL_ADDRESS (the postal address printed in alert emails; alerts send nothing without it).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      data_migration_verified:
        description: "Production only: I have verified the existing D1 data and encrypted-connection migration"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d215df9a813c0d7a292613373dfa9cb0
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check credentials are configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Production gate
        if: env.TARGET == 'production'
        run: |
          if [ "${{ inputs.data_migration_verified }}" != "true" ]; then
            echo "::error::Production deploys require confirming the data-migration check (see docs/site-launch.md)."
            exit 1
          fi

      - name: Source safety
        run: node scripts/check-source-safety.mjs
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build
        # Optional revenue features, off unless the environment variable is 1 (Settings > Environments > staging or
        # production > Environment variables). At build time the flags add the disclosure copy and the /plan-review/
        # sitemap entry; the deploy step below passes the same values to the Worker.
        env:
          SCHOOL_INQUIRIES_ENABLED: ${{ vars.SCHOOL_INQUIRIES_ENABLED }}
          PLAN_REVIEW_ENABLED: ${{ vars.PLAN_REVIEW_ENABLED }}
        run: npm run build
      - name: Core tests
        run: node scripts/test-core.mjs
      - name: Production configuration check
        if: env.TARGET == 'production'
        env:
          DEGREESTEPS_DATA_MIGRATION_VERIFIED: '1'
        run: node scripts/check-production-config.mjs

      - name: Select configuration
        run: |
          if [ "$TARGET" = production ]; then
            echo "WRANGLER_CONFIG=wrangler.jsonc" >> "$GITHUB_ENV"
            echo "D1_NAME=degreesteps-public" >> "$GITHUB_ENV"
            echo "WORKER_NAME=degreesteps" >> "$GITHUB_ENV"
          else
            echo "WRANGLER_CONFIG=wrangler.staging.jsonc" >> "$GITHUB_ENV"
            echo "D1_NAME=degreesteps-staging-public" >> "$GITHUB_ENV"
            echo "WORKER_NAME=degreesteps-staging" >> "$GITHUB_ENV"
          fi

      - name: Apply database migrations
        run: npx --yes wrangler@4.164.0 d1 migrations apply "$D1_NAME" --remote --config "$WRANGLER_CONFIG"

      - name: Deploy Worker
        # wrangler deploy replaces the Worker's plain variables with these, so every flag and setting is passed on
        # each deploy. A flag that is not exactly 1 is left unset (off).
        env:
          SCHOOL_INQUIRIES_ENABLED: ${{ vars.SCHOOL_INQUIRIES_ENABLED }}
          PLAN_REVIEW_ENABLED: ${{ vars.PLAN_REVIEW_ENABLED }}
          EMAIL_ALERTS_ENABLED: ${{ vars.EMAIL_ALERTS_ENABLED }}
          EMAIL_POSTAL_ADDRESS: ${{ vars.EMAIL_POSTAL_ADDRESS }}
          COACH_ENABLED: ${{ vars.COACH_ENABLED }}
          COACH_DAILY_USD_CAP: ${{ vars.COACH_DAILY_USD_CAP }}
          COACH_MODEL: ${{ vars.COACH_MODEL }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_DAILY_CAP: ${{ vars.EMAIL_DAILY_CAP }}
        run: |
          flags=()
          for name in SCHOOL_INQUIRIES_ENABLED PLAN_REVIEW_ENABLED EMAIL_ALERTS_ENABLED COACH_ENABLED; do
            if [ "${!name}" = "1" ]; then flags+=(--var "$name:1"); fi
          done
          # Optional settings: passed only when set as GitHub environment variables.
          for name in EMAIL_POSTAL_ADDRESS COACH_DAILY_USD_CAP COACH_MODEL EMAIL_FROM EMAIL_DAILY_CAP; do
            if [ -n "${!name}" ]; then flags+=(--var "$name:${!name}"); fi
          done
          if [ "$EMAIL_ALERTS_ENABLED" = "1" ] && [ -z "$EMAIL_POSTAL_ADDRESS" ]; then
            echo "::warning::EMAIL_ALERTS_ENABLED is 1 but EMAIL_POSTAL_ADDRESS is not set; alert emails will not be sent."
          fi
          npx --yes wrangler@4.164.0 deploy --config "$WRANGLER_CONFIG" "${flags[@]}"

      - name: Set Claude API key secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY repository secret; leaving the Worker secret unchanged."
            exit 0
          fi
          printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@4.164.0 secret put ANTHROPIC_API_KEY --config "$WRANGLER_CONFIG" >/dev/null
          echo "ANTHROPIC_API_KEY updated on $WORKER_NAME."

      - name: Set Resend API key secret
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "No RESEND_API_KEY repository secret; leaving the Worker secret unchanged."
            exit 0
          fi
          printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4.164.0 secret put RESEND_API_KEY --config "$WRANGLER_CONFIG" >/dev/null
          echo "RESEND_API_KEY updated on $WORKER_NAME."

      - name: Set hashing salt secrets
        env:
          LEADS_HASH_SALT: ${{ secrets.LEADS_HASH_SALT }}
          COACH_HASH_SALT: ${{ secrets.COACH_HASH_SALT }}
        run: |
          for name in LEADS_HASH_SALT COACH_HASH_SALT; do
            if [ -z "${!name}" ]; then
              echo "No $name repository secret; leaving the Worker secret unchanged."
              continue
            fi
            printf '%s' "${!name}" | npx --yes wrangler@4.164.0 secret put "$name" --config "$WRANGLER_CONFIG" >/dev/null
            echo "$name updated on $WORKER_NAME."
          done

      - name: Publish prepared starter discussions
        # The Worker labels these as DegreeSteps examples before they become visible.
        # Guarded upserts preserve real participation and moderator removals.
        run: |
          node scripts/build-community-starters.mjs --check
          npx --yes wrangler@4.164.0 d1 execute "$D1_NAME" --remote --config "$WRANGLER_CONFIG" --file content/community/starter-library.sql --yes

      - name: Summary
        run: |
          {
            echo "## Deployed to $TARGET"
            echo
            echo "Worker \`$WORKER_NAME\`, database \`$D1_NAME\`, commit \`${GITHUB_SHA::7}\`."
          } >> "$GITHUB_STEP_SUMMARY"
